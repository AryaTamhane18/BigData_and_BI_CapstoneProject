# ============================================================
# Supply Chain Intelligence Capstone
# Docker Compose — Infrastructure Services
#
# Services:
#   neo4j   — Property graph database (Neo4j 5 + GDS plugin)
#   qdrant  — Vector database for semantic similarity search
#
# Usage:
#   Start:   docker compose up -d
#   Stop:    docker compose down
#   Logs:    docker compose logs -f
#   Reset:   docker compose down -v   (wipes all data volumes)
# ============================================================

version: "3.9"

services:

  # ── Neo4j — Property Graph Database ────────────────────────
  neo4j:
    image: neo4j:5.20.0-enterprise
    container_name: supply_chain_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Bolt protocol (Python driver)
    environment:
      NEO4J_AUTH: "${NEO4J_USER}/${NEO4J_PASSWORD}"
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      # Enable Graph Data Science plugin
      NEO4J_PLUGINS: '["graph-data-science"]'
      # Memory settings — adjust to your machine
      NEO4J_server_memory_heap_initial__size: "1g"
      NEO4J_server_memory_heap_max__size: "2g"
      NEO4J_server_memory_pagecache_size: "1g"
      # Allow CSV imports from any local path
      NEO4J_dbms_security_allow__csv__import__from__file__urls: "true"
      NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── Qdrant — Vector Database ────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.4
    container_name: supply_chain_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__SERVICE__GRPC_PORT: "6334"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

# ── Named Volumes ────────────────────────────────────────────
volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  qdrant_data:
